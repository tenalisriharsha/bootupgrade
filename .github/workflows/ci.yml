name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test core
        working-directory: core
        run: mvn -B test

  samples:
    name: samples (${{ matrix.sample }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample:
          - legacy-rest-service
          - legacy-jpa-service
          - legacy-security-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test ${{ matrix.sample }}
        working-directory: samples/${{ matrix.sample }}
        run: mvn -B test

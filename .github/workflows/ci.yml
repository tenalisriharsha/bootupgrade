name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test core
        working-directory: core
        run: mvn -B test

  samples:
    name: samples (${{ matrix.sample }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample:
          - legacy-rest-service
          - legacy-jpa-service
          - legacy-security-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test ${{ matrix.sample }}
        working-directory: samples/${{ matrix.sample }}
        run: mvn -B test

  api:
    name: api (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test api
        working-directory: api
        run: mvn -B test

  dashboard:
    name: dashboard (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Run unit tests
        working-directory: dashboard
        run: npm test
      - name: Production build
        working-directory: dashboard
        run: npx ng build

  infra:
    name: infra (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: fmt
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: init (root)
        working-directory: infra
        run: terraform init -input=false
      - name: validate (root)
        working-directory: infra
        run: terraform validate
      # No real AWS account/credentials exist in CI, so `plan`/`apply`
      # aren't run here — `terraform test` below exercises every module
      # (and the root module's cross-module wiring) against a mocked
      # provider instead, which needs no credentials at all.
      - name: test (root — cross-module wiring)
        working-directory: infra
        run: terraform test
      - name: test (each module)
        working-directory: infra
        run: |
          set -e
          for m in network rds ecs static_site; do
            echo "::group::module $m"
            (cd "modules/$m" && terraform init -input=false && terraform test)
            echo "::endgroup::"
          done

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test core
        working-directory: core
        run: mvn -B test
